name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']
    steps:
      - name: LocalBase auschecken
        uses: actions/checkout@v7
        with:
          path: localbase
      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.php-version == '8.3' && 'xdebug' || 'none' }}
          tools: none
      - name: PHP-Tests
        if: matrix.php-version == '8.5'
        working-directory: localbase
        run: php tests/run.php
      - name: PHP-Coverage-Tooling installieren
        if: matrix.php-version == '8.3'
        run: composer install --working-dir=localbase/tests/coverage --no-interaction --no-progress --prefer-dist
      - name: PHP-Coverage
        if: matrix.php-version == '8.3'
        working-directory: localbase
        run: |
          mkdir -p "$RUNNER_TEMP/php-coverage"
          PHP_COVERAGE_COMMAND="$GITHUB_WORKSPACE/localbase/tests/coverage/vendor/bin/phpcov" \
          PHP_COVERAGE_OUTPUT_DIR="$RUNNER_TEMP/php-coverage" \
          php tests/run.php
          php "$GITHUB_WORKSPACE/localbase/tests/coverage/merge-clover.php" localbase "$RUNNER_TEMP/php-coverage" 95.71

  javascript:
    name: JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: LocalBase auschecken
        uses: actions/checkout@v7
        with:
          path: localbase
      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: JavaScript-Coverage-Tooling installieren
        run: npm ci --prefix localbase/tests/coverage --ignore-scripts
      - name: JavaScript-Tests mit Coverage
        working-directory: localbase
        run: |
          tests/coverage/node_modules/.bin/c8 \
            --all \
            '--include=js/**/*.js' \
            --check-coverage \
            --lines=61.14 \
            node tests/run-js.mjs

  consumer-contracts:
    name: Verbraucher-Verträge
    needs: [php, javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: LocalBase auschecken
        uses: actions/checkout@v7
        with:
          path: localbase
      - name: Verbraucher-Referenz bestimmen
        id: consumer-ref
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          repositories=(
            Filzmann/nextcloud-orgsuite
            Filzmann/nextcloud-flzcalendar
            Filzmann/nextcloud-flzplaner
            Filzmann/nextcloud-flzurlaub
            Filzmann/nextcloud-flzroom
            Filzmann/nextcloud-brtop
            Filzmann/nextcloud-brstunden
            Filzmann/nextcloud-flz-permission-matrix
            Filzmann/nextcloud-flzrecruitment
          )
          for repository in "${repositories[@]}"; do
            if ! git ls-remote --exit-code --heads "https://github.com/${repository}.git" "refs/heads/$CANDIDATE_REF" >/dev/null 2>&1; then
              echo "ref=main" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ref=$CANDIDATE_REF" >> "$GITHUB_OUTPUT"
      - name: OrgSuite auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-orgsuite
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: orgsuite
      - name: Filzmann Kalender auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-flzcalendar
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: flzcalendar
      - name: Assistenzplanung auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-flzplaner
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: flzplaner
      - name: Filzmann Urlaubsplanung auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-flzurlaub
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: flzurlaub
      - name: Filzmann Raumplaner auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-flzroom
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: flzroom
      - name: BRTop auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-brtop
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: brtop
      - name: BRStunden auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-brstunden
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: brstunden
      - name: Berechtigungsmatrix auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-flz-permission-matrix
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: flz_permission_matrix
      - name: Filzmann Recruitment auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-flzrecruitment
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: flzrecruitment
      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: OrgSuite-Vertrag
        working-directory: orgsuite
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: Filzmann-Kalender-Vertrag
        working-directory: flzcalendar
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: Assistenzplanungs-Vertrag
        working-directory: flzplaner
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: Filzmann-Urlaubsplanungs-Vertrag
        working-directory: flzurlaub
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: Filzmann-Raumplaner-Vertrag
        working-directory: flzroom
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: BRTop-Vertrag
        working-directory: brtop
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: BRStunden-Vertrag
        working-directory: brstunden
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: Berechtigungsmatrix-Vertrag
        working-directory: flz_permission_matrix
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: Filzmann-Recruitment-Vertrag
        working-directory: flzrecruitment
        run: |
          php tests/run.php
          node tests/run-js.mjs

  deploy-staging:
    name: Staging-Deployment
    if: github.event_name == 'push'
    needs: [php, javascript, consumer-contracts]
    uses: Filzmann/br-nextcloud-apps/.github/workflows/deploy-staging.yml@main
    with:
      app-id: localbase
    secrets: inherit
