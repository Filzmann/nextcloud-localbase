name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']
    steps:
      - name: LocalBase auschecken
        uses: actions/checkout@v7
        with:
          path: localbase
      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.php-version == '8.3' && 'xdebug' || 'none' }}
          tools: none
      - name: PHP-Tests
        if: matrix.php-version == '8.5'
        working-directory: localbase
        run: php tests/run.php
      - name: PHP-Coverage-Tooling installieren
        if: matrix.php-version == '8.3'
        run: composer install --working-dir=localbase/tests/coverage --no-interaction --no-progress --prefer-dist
      - name: PHP-Coverage
        if: matrix.php-version == '8.3'
        working-directory: localbase
        run: |
          mkdir -p "$RUNNER_TEMP/php-coverage"
          PHP_COVERAGE_COMMAND="$GITHUB_WORKSPACE/localbase/tests/coverage/vendor/bin/phpcov" \
          PHP_COVERAGE_OUTPUT_DIR="$RUNNER_TEMP/php-coverage" \
          php tests/run.php
          php "$GITHUB_WORKSPACE/localbase/tests/coverage/merge-clover.php" localbase "$RUNNER_TEMP/php-coverage" 95.71

  javascript:
    name: JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: LocalBase auschecken
        uses: actions/checkout@v7
        with:
          path: localbase
      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: JavaScript-Coverage-Tooling installieren
        run: npm ci --prefix localbase/tests/coverage --ignore-scripts
      - name: JavaScript-Tests mit Coverage
        working-directory: localbase
        run: |
          tests/coverage/node_modules/.bin/c8 \
            --all \
            '--include=js/**/*.js' \
            --check-coverage \
            --lines=61.14 \
            node tests/run-js.mjs

  consumer-contracts:
    name: Verbraucher-Verträge
    needs: [php, javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: LocalBase auschecken
        uses: actions/checkout@v7
        with:
          path: localbase
      - name: OrgSuite auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-orgsuite
          path: orgsuite
      - name: AD Kalender auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-adcalendar
          path: adcalendar
      - name: Assistenzplanung auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-adplaner
          path: adplaner
      - name: AD Urlaub auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-adurlaub
          path: adurlaub
      - name: AD Raumplaner auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-adroom
          path: adroom
      - name: BRTop auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-brtop
          path: brtop
      - name: BRStunden auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-brstunden
          path: brstunden
      - name: Berechtigungsmatrix auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-br-permission-matrix
          path: br_permission_matrix
      - name: AD Recruitment auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/nextcloud-recruitment
          path: adrecruitment
      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: OrgSuite-Vertrag
        working-directory: orgsuite
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: AD-Kalender-Vertrag
        working-directory: adcalendar
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: Assistenzplanungs-Vertrag
        working-directory: adplaner
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: AD-Urlaubs-Vertrag
        working-directory: adurlaub
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: AD-Raumplaner-Vertrag
        working-directory: adroom
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: BRTop-Vertrag
        working-directory: brtop
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: BRStunden-Vertrag
        working-directory: brstunden
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: Berechtigungsmatrix-Vertrag
        working-directory: br_permission_matrix
        run: |
          php tests/run.php
          node tests/run-js.mjs
      - name: AD-Recruitment-Vertrag
        working-directory: adrecruitment
        run: |
          php tests/run.php
          node tests/run-js.mjs

  deploy-staging:
    name: Staging-Deployment
    if: github.event_name == 'push'
    needs: [php, javascript, consumer-contracts]
    uses: Filzmann/br-nextcloud-apps/.github/workflows/deploy-staging.yml@main
    with:
      app-id: localbase
    secrets: inherit
